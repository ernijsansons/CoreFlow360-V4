name = "coreflow360-v4-prod"
main = "src/index.production.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "d2897bdebfa128919bd89b265e6a712e"

# Production D1 Database bindings
# Note: Removed duplicate "DB" binding - using DB_MAIN only
[[d1_databases]]
binding = "DB_MAIN"
database_name = "coreflow360-agents"
database_id = "c56bb204-78bc-4357-a704-419aa9f11e6f"
migrations_dir = "database/migrations"

[[d1_databases]]
binding = "DB_ANALYTICS"
database_name = "mustbeviral-db"
database_id = "4cdeab75-a1b4-477e-a92c-de996065578c"

# Production KV Namespace bindings
# TODO: These are PLACEHOLDER IDs - must create production-specific namespaces
# Run: wrangler kv namespace create KV_CACHE_PROD
[[kv_namespaces]]
binding = "KV_CACHE"
id = "prod-cache-namespace-id-PLACEHOLDER"

[[kv_namespaces]]
binding = "KV_SESSION"
id = "prod-session-namespace-id-PLACEHOLDER"

[[kv_namespaces]]
binding = "KV_RATE_LIMIT_METRICS"
id = "prod-rate-limit-namespace-id-PLACEHOLDER"

[[kv_namespaces]]
binding = "KV_AUTH"
id = "prod-auth-namespace-id-PLACEHOLDER"

# Agent-specific KV namespaces
[[kv_namespaces]]
binding = "AGENT_CACHE"
id = "prod-agent-cache-namespace-id-PLACEHOLDER"

[[kv_namespaces]]
binding = "AGENT_MEMORY"
id = "prod-agent-memory-namespace-id-PLACEHOLDER"

[[kv_namespaces]]
binding = "PATTERN_CACHE"
id = "prod-pattern-cache-namespace-id-PLACEHOLDER"

# Production R2 Bucket bindings (verified to exist)
[[r2_buckets]]
binding = "R2_DOCUMENTS"
bucket_name = "coreflow360-documents"

[[r2_buckets]]
binding = "R2_BACKUPS"
bucket_name = "coreflow360-backups"

# Production Durable Objects (ONLY classes that exist and are exported)
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "AdvancedRateLimiterDO"

[[durable_objects.bindings]]
name = "WORKFLOW_EXECUTOR"
class_name = "WorkflowExecutorDO"

[[durable_objects.bindings]]
name = "REALTIME_COORDINATOR"
class_name = "RealtimeCoordinatorDO"

# Durable Object migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdvancedRateLimiterDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorkflowExecutorDO", "RealtimeCoordinatorDO"]

# AI binding
[ai]
binding = "AI"

# Production environment variables
[vars]
APP_NAME = "CoreFlow360 V4"
API_VERSION = "v4.1.0"
LOG_LEVEL = "info"
ENVIRONMENT = "production"
API_BASE_URL = "https://api.coreflow360.com"
ALLOWED_ORIGINS = "https://app.coreflow360.com,https://www.coreflow360.com,https://production.coreflow360-frontend.pages.dev,https://main.coreflow360-frontend.pages.dev"
AGENT_SYSTEM_ENABLED = "true"
MAX_AGENT_CONCURRENCY = "10"
AGENT_TIMEOUT_MS = "30000"

# Production route configuration
# NOTE: Requires coreflow360.com zone to be configured in Cloudflare
# Comment out if zone doesn't exist yet - use workers.dev subdomain instead
[[routes]]
pattern = "api.coreflow360.com/*"
zone_name = "coreflow360.com"

[[routes]]
pattern = "coreflow360.com/api/*"
zone_name = "coreflow360.com"

# Performance and observability
[observability]
enabled = true
head_sampling_rate = 0.1  # Increased from 0.01 (1%) to 0.1 (10%) for better debugging

[placement]
mode = "smart"

# Production build settings
[build]
command = "npm run build:production"

# ============================================================================
# REQUIRED SECRETS - Set via: wrangler secret put SECRET_NAME
# ============================================================================
# wrangler secret put JWT_SECRET
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put OPENAI_API_KEY
# wrangler secret put EMAIL_API_KEY
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET
# wrangler secret put SENTRY_DSN
# wrangler secret put ENCRYPTION_KEY
# wrangler secret put AUTH_SECRET
# ============================================================================
