    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        z-index: 9999;
      }
      .loader {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .loading-subtext {
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <script>
      // ============================================================================
      // FATAL ERROR CAPTURE - Runs BEFORE any ES module evaluation
      // ============================================================================
      (function() {
        window.__CF360_FATAL__ = function(label, detail) {
          const text =
            typeof detail === 'string'
              ? detail
              : detail instanceof Error
                ? detail.name + ': ' + detail.message + '\n' + (detail.stack || '')
                : JSON.stringify(detail, null, 2);

          try {
            console.error('[CoreFlow360] ' + label + ':', detail);
          } catch (e) {
            // Ignore console errors if console has been hijacked
          }

          let panel = document.getElementById('cf360-fatal-dump');
          if (!panel) {
            panel = document.createElement('pre');
            panel.id = 'cf360-fatal-dump';
            panel.style.cssText =
              'position:fixed;top:0;left:0;right:0;white-space:pre-wrap;background:#111827;color:#f87171;padding:16px;font:14px/1.4 monospace;overflow:auto;border-bottom:4px solid #f87171;z-index:2147483647;max-height:300px;';
            document.body.prepend(panel);
          }
          panel.textContent = '[CoreFlow360] ' + label + '\n\n' + text;

          // Alert to ensure visibility even if console is hidden
          try {
            alert('[CoreFlow360] ' + label + '\n' + text);
          } catch (e) {
            // Swallow if alerts are disabled
          }
        };

        // Wire global handlers immediately
        window.addEventListener('error', function(event) {
          window.__CF360_FATAL__('EARLY_ERROR', event.error || event.message);
        });

        window.addEventListener('unhandledrejection', function(event) {
          window.__CF360_FATAL__('EARLY_UNHANDLED_REJECTION', event.reason);
        });

        console.log('[CoreFlow360] Early fatal capture initialized');
      })();
    </script>

    <div id="loading-screen">
      <div class="loader"></div>
      <div class="loading-text">CoreFlow360 V4</div>
      <div class="loading-subtext">Initializing AI-First Platform...</div>
      <div class="loading-subtext" style="margin-top: 20px; font-size: 12px;">If this persists, press F12 to check console</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Enhanced error handling and diagnostics
      window.addEventListener('error', function(event) {
        console.error('[CoreFlow360] Global error caught:', event.error);
        console.error('[CoreFlow360] Error details:', {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: event.error?.stack
        });
      });

      window.addEventListener('unhandledrejection', function(event) {
        console.error('[CoreFlow360] Unhandled promise rejection:', event.reason);
      });

      // CSS validation function
      function validateCSSVariables() {
        const criticalVars = [
          '--brand-primary-600',
          '--brand-accent-600',
          '--brand-teal-600',
          '--semantic-success-500',
          '--semantic-warning-500',
          '--semantic-error-500'
        ];
        
        const missing = [];
        const rootStyles = getComputedStyle(document.documentElement);
        
        for (const variable of criticalVars) {
          const value = rootStyles.getPropertyValue(variable).trim();
          if (!value) {
            missing.push(variable);
          }
        }
        
        if (missing.length > 0) {
          console.error('[CoreFlow360] CSS Validation Failed - Missing variables:', missing);
          return false;
        } else {
          console.log('[CoreFlow360] CSS Validation Passed - All critical variables loaded');
          return true;
        }
      }

          document.body.innerHTML = '<div>Application Loading Failed</div>';
        }

      */
    </script>
