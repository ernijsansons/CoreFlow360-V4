name = "coreflow360-frontend"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./dist"

[vars]
NODE_ENV = "production"
API_URL = "https://coreflow360-v4-prod.ernijs-ansons.workers.dev"

[[kv_namespaces]]
binding = "FEATURE_FLAGS"
id = "feature-flags-kv"

[[kv_namespaces]]
binding = "APP_CACHE"
id = "app-cache-kv"

# Pages only supports "production" and "preview" environments
[env.production.vars]
API_URL = "https://coreflow360-v4-prod.ernijs-ansons.workers.dev"
SENTRY_DSN = ""
CLOUDFLARE_ANALYTICS_TOKEN = ""

[env.preview.vars]
API_URL = "https://coreflow360-v4-prod.ernijs-ansons.workers.dev"
SENTRY_DSN = ""
CLOUDFLARE_ANALYTICS_TOKEN = ""